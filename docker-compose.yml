# Self-hosting stack for Corvale: MongoDB + the Express API + the built frontend behind nginx.
# See docs/developers/deployment.md for the full setup guide, including HTTPS, ClamAV, and
# S3-compatible receipt storage.
#
# This stack serves plain HTTP on :8080 / :5000. Any internet-facing deployment MUST run behind
# a TLS terminator that also redirects HTTP->HTTPS (Caddy does both automatically) - without it
# session cookies and financial data cross the wire in cleartext. Also set NODE_ENV=production
# in backend/.env so the refresh cookie is marked Secure. See the "Putting it behind HTTPS"
# section of the deployment guide.
#
# Before running `docker compose up -d --build`:
#   1. cp backend/.env.example backend/.env   and fill in real values (JWT_SECRET,
#      OFFLINE_GRANT_PRIVATE_KEY, CLIENT_URL, etc). MONGO_URI in that file is overridden below
#      to point at the bundled `mongo` service.
#   2. cp .env.example .env   and fill in the frontend build-time values (these become part of
#      the compiled JS, so they must be set before `docker compose build`, not after).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever MONGO_URI is set to in backend/.env so the container always talks
      # to the bundled `mongo` service rather than a stale localhost value.
      # Renamed spndr -> corvale with the product rename. If you self-hosted before the rename,
      # your data is still in the `spndr` database on the same mongo volume — either set this
      # back to `.../spndr` or `db.copyDatabase`/`mongodump | mongorestore` it into `corvale`.
      MONGO_URI: mongodb://mongo:27017/corvale
      PORT: 5000
      # Overrides backend/.env's CLIENT_URL (which most people leave pointed at :5173 for their
      # normal non-Docker `npm run dev`) with this stack's actual frontend origin, so CORS
      # admits it. Change this if you're serving the frontend container from a different host
      # or port (e.g. behind a reverse proxy - see docs/developers/deployment.md).
      CLIENT_URL: http://localhost:8080
    depends_on:
      - mongo
    ports:
      - '5000:5000'
    volumes:
      # Only used when RECEIPT_STORAGE_DRIVER is unset (local-disk receipts). Safe to remove
      # once RECEIPT_STORAGE_DRIVER=s3 is configured in backend/.env.
      - uploads-data:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/corvale/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://localhost:5000}
        VITE_OFFLINE_GRANT_PUBLIC_KEY: ${VITE_OFFLINE_GRANT_PUBLIC_KEY:-}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
        VITE_CAPTCHA_ENABLED: ${VITE_CAPTCHA_ENABLED:-false}
        VITE_CAPTCHA_SITE_KEY: ${VITE_CAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

  # Optional receipt virus scanning. Enable with:
  #   docker compose --profile clamav up -d --build
  # and set VIRUS_SCAN_ENABLED=true, CLAMAV_HOST=clamav in backend/.env.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ['clamav']
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  mongo-data:
  uploads-data:
  clamav-data:
