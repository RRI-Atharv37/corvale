# Self-hosting stack for Corvale: MongoDB + the Express API + the built frontend behind nginx.
# See docs/developers/guides/deployment.md for the full setup guide, including HTTPS, ClamAV, and
# S3-compatible receipt storage.
#
# This stack serves plain HTTP on 127.0.0.1:8080 / 127.0.0.1:5000 - loopback only (SEC-65), so
# the host's reverse proxy is the sole public entrypoint. Any internet-facing deployment MUST run
# behind a TLS terminator that also redirects HTTP->HTTPS (Caddy does both automatically) -
# without it session cookies and financial data cross the wire in cleartext. Also set
# NODE_ENV=production in backend/.env so the refresh cookie is marked Secure. See the "Putting it
# behind HTTPS" section of the deployment guide.
#
# Before running `docker compose up -d --build`:
#   1. cp backend/.env.example backend/.env   and fill in real values (JWT_SECRET,
#      OFFLINE_GRANT_PRIVATE_KEY, CLIENT_URL, etc). MONGO_URI in that file is overridden below
#      to point at the bundled `mongo` service.
#   2. cp .env.example .env   and fill in the frontend build-time values (these become part of
#      the compiled JS, so they must be set before `docker compose build`, not after) AND set
#      MONGO_ROOT_PASSWORD — the bundled MongoDB runs with authentication enabled (SEC-37) and
#      `docker compose up` refuses to start until that value is set.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # SEC-37: this service is deliberately NOT published to the host. There is no `ports:` entry
    # here and there must never be one — the absent mapping is load-bearing. The bundled MongoDB
    # is reachable only from the other services on the internal Compose network, and that
    # isolation plus the credentials below are the only things between the internet and the
    # entire financial dataset. Do NOT add `ports: ['27017:27017']`, not even "just to debug":
    # use `docker compose exec mongo mongosh -u "$MONGO_ROOT_USERNAME" -p "$MONGO_ROOT_PASSWORD"
    # --authenticationDatabase admin` instead.
    environment:
      # Creates the root user in the `admin` database on the mongo-data volume's FIRST
      # initialization only. Values come from the repo-root `.env` (see .env.example).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-corvale}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env — see .env.example}
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever MONGO_URI is set to in backend/.env so the container always talks
      # to the bundled `mongo` service rather than a stale localhost value.
      # Renamed spndr -> corvale with the product rename. If you self-hosted before the rename,
      # your data is still in the `spndr` database on the same mongo volume — either set this
      # back to `.../spndr` or `db.copyDatabase`/`mongodump | mongorestore` it into `corvale`.
      # Credentials and `authSource=admin` match the root user created by the `mongo` service
      # above (SEC-37). Keep MONGO_ROOT_PASSWORD URL-safe — it is substituted in here unescaped.
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-corvale}:${MONGO_ROOT_PASSWORD}@mongo:27017/corvale?authSource=admin
      PORT: 5000
      # Overrides backend/.env's CLIENT_URL (which most people leave pointed at :5173 for their
      # normal non-Docker `npm run dev`) with this stack's actual frontend origin, so CORS
      # admits it. Change this if you're serving the frontend container from a different host
      # or port (e.g. behind a reverse proxy - see docs/developers/guides/deployment.md).
      CLIENT_URL: http://localhost:8080
    depends_on:
      - mongo
    ports:
      # SEC-65: loopback only. The host reverse proxy (Caddy/nginx - see
      # docs/developers/guides/deployment.md) is the sole public entrypoint. Do NOT change this to
      # '5000:5000' / '0.0.0.0:5000:5000' on an internet-facing host: Docker's iptables DNAT
      # rules bypass ufw, so that would expose the financial API regardless of a host firewall.
      # If the proxy runs on a separate host, bind to the private interface in
      # docker-compose.override.yml instead (see docker-compose.override.example.yml).
      - '127.0.0.1:5000:5000'
    volumes:
      # Only used when RECEIPT_STORAGE_DRIVER is unset (local-disk receipts). Safe to remove
      # once RECEIPT_STORAGE_DRIVER=s3 is configured in backend/.env.
      - uploads-data:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/corvale/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://localhost:5000}
        VITE_OFFLINE_GRANT_PUBLIC_KEY: ${VITE_OFFLINE_GRANT_PUBLIC_KEY:-}
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
        VITE_CAPTCHA_ENABLED: ${VITE_CAPTCHA_ENABLED:-false}
        VITE_CAPTCHA_SITE_KEY: ${VITE_CAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # SEC-65: loopback only - served to the public through the host reverse proxy. Same
      # reasoning as the backend service above. Container port is 8080, not 80: the image runs
      # nginx unprivileged (SEC-67), which cannot bind a port <1024.
      - '127.0.0.1:8080:8080'

  # Optional receipt virus scanning. Enable with:
  #   docker compose --profile clamav up -d --build
  # and set VIRUS_SCAN_ENABLED=true, CLAMAV_HOST=clamav in backend/.env.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ['clamav']
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  mongo-data:
  uploads-data:
  clamav-data:
