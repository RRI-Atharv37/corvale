name: Bug report
description: Report something that's broken or not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a **security vulnerability**,
        please don't file it here — see [SECURITY.md](../SECURITY.md) for private reporting
        instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As specific as possible — the exact page/endpoint, inputs used, etc.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (browser)
        - Desktop app (Tauri)
        - Backend API (direct)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser (and version) if relevant
      placeholder: e.g. Windows 11, Chrome 128
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that might help
    validations:
      required: false
