name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Note that Corvale is a solo-maintained personal/portfolio
        project — not every idea will get picked up, but it's still useful to hear.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's the problem you're trying to solve, or the gap you've noticed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about, or workarounds you're using today
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
