# Runs under the nginxinc/nginx-unprivileged base image (SEC-67): the nginx master and workers
# run as the unprivileged `nginx` user (uid 101), so the listener must be on a port >1024.
# docker-compose.yml maps the host's 127.0.0.1:8080 straight to this.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ------------------------------------------------------------------
    # The CSP in index.html is delivered via <meta http-equiv>, and `frame-ancestors` has no
    # effect from a <meta> tag (CSP spec) - so the app is only un-framable if a real header is
    # sent here too (SEC-31). Keep the meta policy as the belt-and-braces copy of the full
    # policy; this header carries only what a <meta> tag cannot express plus the cheap extras.
    #
    # The CSP here is deliberately just `frame-ancestors` rather than a mirror of the meta
    # policy: the meta policy's `connect-src` is templated from VITE_API_ORIGIN at build time,
    # and a same-site-but-cross-origin API (e.g. api.corvale.example) would be blocked by a
    # second, stricter `connect-src 'self'` policy delivered from this layer.
    #
    # nginx does NOT inherit `add_header` into a location block that sets any header of its own,
    # so every location below that adds a header repeats this whole set. `always` makes them
    # apply to error responses (the 404 branch, redirects) as well as 2xx.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SEC-68: deny every powerful browser feature the app never uses. Kept identical to the
    # PERMISSIONS_POLICY constant in backend/app.ts so the policy reads the same from either layer.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()" always;
    # Honoured by browsers only over HTTPS (ignored on the cleartext hop from the TLS
    # terminator), so it is safe to send unconditionally. The TLS terminator is required for any
    # internet-facing deployment - see docs/developers/deployment.md. `preload` is deliberately
    # not sent (SEC-68) - it is a hard-to-reverse commitment for every corvale.app subdomain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upgrade cleartext to HTTPS when the terminator tells us the external request was http.
    # Behind Caddy (per V10) this never fires - Caddy 301s http->https itself - but it protects
    # a deployment whose proxy is misconfigured to forward cleartext. It stays inert for a local
    # `docker compose up` with no proxy in front, where the header is absent.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Single-page app: any path that isn't a real static file falls back to index.html so
    # client-side routing (react-router) can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        # Repeated because this block declares its own add_header (see the note above).
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
