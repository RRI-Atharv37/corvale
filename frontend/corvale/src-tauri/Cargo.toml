[package]
name = "corvale"
version = "1.0.0"
description = "Corvale desktop shell — personal finance tracker"
authors = ["Corvale"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "corvale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled-sqlcipher-vendored-openssl` compiles SQLCipher (and its own OpenSSL) from source rather
# than linking a system SQLite/OpenSSL, so `cargo build` doesn't depend on what's preinstalled on
# the machine — the tradeoff is a much longer first build. See docs/desktop/building-the-desktop-app.md.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
