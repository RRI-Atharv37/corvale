<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Corvale — Stop guessing. Start knowing. Personal finance for students and young adults who are tired of balance shock." />
    <meta name="theme-color" content="#14121c" />
    <!--
      Corvale is dark-only. Declaring the color scheme here - before any CSS loads - makes the
      browser paint the initial canvas, form controls and native scrollbars dark on the very
      first frame, killing the white flash on load. `:root { color-scheme: dark }` in index.css
      backs this up for the parsed document. This is also the only lever that reaches OS-rendered
      <select> popups (V8).
    -->
    <meta name="color-scheme" content="dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Strict CSP for the web app (S16, SEC-18) - a second line of defense against injected
      script even if something upstream got past output-encoding. `connect-src` uses
      VITE_API_ORIGIN (scheme+host+port only, no path - unlike VITE_API_URL, which includes
      `/api/v1`) so it matches every path CSP's connect-src actually needs to allow, not just
      one of them: XHR/fetch calls under the API base path, and the bare-origin reachability
      probe in `src/offline/reachability.ts`.
      `frame-ancestors` has no effect via a <meta> tag (CSP spec) - a real deployment must also
      send it (or X-Frame-Options) as an HTTP response header at the hosting/reverse-proxy layer.
      The shipped frontend/corvale/nginx.conf does this (CSP `frame-ancestors 'none'` +
      X-Frame-Options: DENY, plus nosniff / Referrer-Policy / HSTS); a non-nginx host must
      replicate those headers - see docs/developers/deployment.md "Security headers".
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' %VITE_API_ORIGIN%; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>Corvale — Know where every dollar went</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
