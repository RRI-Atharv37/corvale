# Copy to docker-compose.override.yml for a production deployment behind a
# TLS-terminating reverse proxy (see Caddyfile + docs/developers/guides/deployment.md).
# Compose merges this over docker-compose.yml automatically, so the tracked file
# stays untouched and `git pull` never conflicts.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # edit CLIENT_URL to your real frontend origin, then:
#   docker compose up -d

services:
  backend:
    environment:
      # Exact public origin of the frontend. CORS is locked to this, and it's
      # used to build password-reset / verification email links.
      CLIENT_URL: https://corvale.app
      # TRUST_PROXY (one proxy hop) is already set in docker-compose.yml. Override it here only if
      # more than one proxy sits in front of the API, e.g. TRUST_PROXY: 2
    # The tracked docker-compose.yml already binds both services to 127.0.0.1 (SEC-65), so a
    # same-host reverse proxy needs nothing here. Only add a `ports:` override if the proxy runs
    # on a DIFFERENT host and must reach the containers over a private network - bind to that
    # interface, never back to 0.0.0.0 on a public-facing host. `!override` replaces the base
    # port list instead of appending to it.
    #
    # ports: !override
    #   - '10.0.0.5:5000:5000'
  # frontend:
  #   ports: !override
  #     - '10.0.0.5:8080:8080'