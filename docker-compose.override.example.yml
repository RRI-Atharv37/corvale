# Copy to docker-compose.override.yml for a production deployment behind a
# TLS-terminating reverse proxy (see Caddyfile + docs/developers/deployment.md).
# Compose merges this over docker-compose.yml automatically, so the tracked file
# stays untouched and `git pull` never conflicts.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   # edit CLIENT_URL to your real frontend origin, then:
#   docker compose up -d

services:
  backend:
    environment:
      # Exact public origin of the frontend. CORS is locked to this, and it's
      # used to build password-reset / verification email links.
      CLIENT_URL: https://corvale.app
      # Proxy hops in front of the API (Caddy on the same host = 1) so rate
      # limiters and Secure-cookie detection see the real client protocol/IP.
      TRUST_PROXY: 1
    # Publish only on loopback - the reverse proxy is the sole public entrypoint.
    # `!override` replaces the base port list instead of appending to it.
    ports: !override
      - '127.0.0.1:5000:5000'
  frontend:
    ports: !override
      - '127.0.0.1:8080:80'